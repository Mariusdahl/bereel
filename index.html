<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rowboat Fishing</title>
<style>
:root{--bg:#dfe8f5;--ink:#10223a;--panel:#ffffffdd}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1626;--ink:#eaf2ff;--panel:#0b1626dd}}
:root[data-theme="dark"]{--bg:#0b1626;--ink:#eaf2ff;--panel:#0b1626dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden;touch-action:manipulation}
body{display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#stage{position:relative;height:min(100%,calc(100vw*16/9));aspect-ratio:9/16;max-width:100%}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block}
.pb{position:absolute;border-radius:50%;border:4px solid #10223a;cursor:pointer;font:700 clamp(10px,3.2vw,16px) ui-monospace,monospace;color:#fff}
#btn{left:50%;bottom:5%;transform:translateX(-50%);width:23%;aspect-ratio:1;background:#e8503a;box-shadow:0 5px 0 #7a2418,inset 0 -6px 0 #b7351f}
#btn:active{transform:translateX(-50%) translateY(4px);box-shadow:0 1px 0 #7a2418,inset 0 -6px 0 #b7351f}
#btn.wait{background:#5b7fb0;box-shadow:0 5px 0 #2c4466,inset 0 -6px 0 #46678f}
#btn.bite{background:#f2c230;color:#10223a;box-shadow:0 5px 0 #8a6a00,inset 0 -6px 0 #c9a01a;animation:sh .18s infinite}
@keyframes sh{0%,100%{margin-left:-2px}50%{margin-left:2px}}
#bag{right:10%;bottom:7%;width:14%;aspect-ratio:1;background:#c58f3f;box-shadow:0 4px 0 #6b4a1c,inset 0 -5px 0 #a8742c;padding:0;display:flex;align-items:center;justify-content:center}
#bag:active{transform:translateY(3px);box-shadow:0 1px 0 #6b4a1c,inset 0 -5px 0 #a8742c}
#bag svg{width:62%;height:62%;shape-rendering:crispEdges}
#toast{position:absolute;top:17%;left:5%;right:5%;text-align:center;padding:10px;background:var(--panel);border:3px solid #10223a;font-size:clamp(11px,3.4vw,15px);opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#buff{top:2%;right:4%;width:10.5%;aspect-ratio:1;background:#3f9b3a;box-shadow:0 4px 0 #1f5a1c,inset 0 -5px 0 #2f7a2c;display:flex;align-items:center;justify-content:center;pointer-events:none}#buff[hidden]{display:none}#buff svg{width:84%;height:84%;shape-rendering:crispEdges}
#panel,#panel2{position:absolute;left:14%;right:14%;top:44%;transform:translateY(-50%);aspect-ratio:1;background:#ecdcb0;border:4px solid #10223a;border-radius:14px;box-shadow:0 6px 0 #7a5a20,inset 0 -6px 0 #d4c08a;color:#10223a;padding:14px 12px 12px;display:flex;flex-direction:column;gap:8px}
#panel[hidden],#panel2[hidden]{display:none}
#panel h2,#panel2 h2{margin:0;font-size:clamp(13px,4vw,18px);letter-spacing:2px}
#x,#x2{position:absolute;top:-14px;right:-14px;width:34px;height:34px;border-radius:50%;background:#e8503a;box-shadow:0 3px 0 #7a2418,inset 0 -3px 0 #b7351f;font-size:18px;line-height:1;padding:0}
#x:active,#x2:active{transform:translateY(2px)}
#grid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start}
.tile{position:relative;background:#f7eecf;border:3px solid;border-radius:8px;padding:0;display:block;font:600 clamp(9px,2.8vw,12px) ui-monospace,monospace;color:#10223a;cursor:help}.tile::before{content:'';display:block;padding-bottom:100%}
.tile.sel{background:#fff;box-shadow:0 0 0 2px #10223a}
.tile i{font-style:normal;position:absolute;right:5px;bottom:2px;color:#fff;font:700 clamp(10px,3vw,13px) ui-monospace,monospace;text-shadow:1px 1px 0 #10223a,-1px 1px 0 #10223a,1px -1px 0 #10223a,-1px -1px 0 #10223a}
#detail,#detail2{border:3px solid #10223a;border-radius:8px;background:#f7eecf;padding:8px;font-size:clamp(10px,3vw,13px);min-height:76px;line-height:1.35}
.ico{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:62%;height:auto;image-rendering:pixelated}#clv{position:absolute;left:50%;top:50%;width:62%;transform:translate(-50%,-50%);image-rendering:pixelated}#tip{position:absolute;z-index:5;max-width:72%;width:max-content;background:#fff8e0;border:3px solid #10223a;border-radius:8px;box-shadow:0 3px 0 #7a5a20;padding:7px 9px;font-size:clamp(10px,3vw,13px);line-height:1.35;color:#10223a;pointer-events:none}#tip[hidden]{display:none}#eq{left:10%;bottom:7%;width:14%;aspect-ratio:1;background:#5b7fb0;box-shadow:0 4px 0 #2c4466,inset 0 -5px 0 #46678f;padding:0;display:flex;align-items:center;justify-content:center}
#eq:active{transform:translateY(3px);box-shadow:0 1px 0 #2c4466,inset 0 -5px 0 #46678f}#eq svg{width:62%;height:62%;shape-rendering:crispEdges}
#slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;align-content:start;flex:1}
.slot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:clamp(9px,2.8vw,12px);font-weight:700}
.slot .tile{width:100%;border-color:#8a7a50}.slot .ico{opacity:.4}#bring{position:absolute;left:5%;top:5%;width:90%;height:90%;display:none;pointer-events:none}#btn.bite #bring{display:block}#total{position:absolute;top:2%;left:4%;padding:6px 10px;background:#7bb8f2;border:2px solid #fff;border-radius:10px;font:700 clamp(10px,3vw,13px) ui-monospace,monospace;color:#fff;pointer-events:none}
#log{display:flex;gap:6px}#log span{flex:1;text-align:center;font-weight:700;font-size:clamp(11px,3.4vw,15px);background:#f7eecf;border-radius:6px;padding:2px 0}
.slot .tile.on .ico{opacity:1}#snd{top:2.2%;left:50%;transform:translateX(-50%);width:8%;aspect-ratio:1;background:#5b7fb0;box-shadow:0 3px 0 #2c4466,inset 0 -3px 0 #46678f;padding:0;font-size:clamp(11px,3.6vw,16px)}#snd:active{transform:translateX(-50%) translateY(2px)}#snd.off{background:#8a97a8;box-shadow:0 3px 0 #4a5566,inset 0 -3px 0 #6b7889;text-decoration:line-through}</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="180" height="320"></canvas>
  <button id="snd" class="pb" aria-label="Sound">♪</button><div id="total">Caught: 0</div><div id="buff" class="pb" hidden><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="#1f5a1c" stroke-width="3" opacity=".5"/><circle id="ring" cx="20" cy="20" r="16" fill="none" stroke="#f2c230" stroke-width="3" stroke-dasharray="100.53" stroke-dashoffset="0" transform="rotate(-90 20 20)"/></svg><canvas id="clv" width="16" height="16"></canvas></div>
  <div id="toast"></div>
  <button id="btn" class="pb"><svg id="bring" viewBox="0 0 40 40"><circle id="bringc" cx="20" cy="20" r="17" fill="none" stroke="#10223a" stroke-width="3" stroke-dasharray="106.8" transform="rotate(-90 20 20)"/></svg><span id="bt">CAST</span></button>
  <button id="bag" class="pb" aria-label="Bag"><svg viewBox="0 0 12 12"><rect x="4" y="1" width="4" height="2" fill="#6b4a1c"/><rect x="3" y="3" width="6" height="2" fill="#e0a84c"/><rect x="2" y="4" width="8" height="7" fill="#a8742c"/><rect x="2" y="9" width="8" height="2" fill="#6b4a1c"/><rect x="5" y="6" width="2" height="2" fill="#e8d9b0"/></svg></button>
  <button id="eq" class="pb" aria-label="Equipment"><svg viewBox="0 0 12 12"><rect x="3" y="2" width="6" height="5" fill="#d8b468"/><rect x="1" y="7" width="10" height="2" fill="#d8b468"/><rect x="3" y="5" width="6" height="1" fill="#6a4a24"/><rect x="1" y="8" width="10" height="1" fill="#a8803c"/></svg></button><div id="tip" hidden></div><div id="panel2" hidden><button id="x2" class="pb">×</button><h2>EQUIPMENT</h2><div id="slots"></div></div><div id="panel" hidden><button id="x" class="pb">×</button><h2>BAG</h2><div id="log"></div><div id="grid"></div></div>
</div>
<script>

function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function setBtn(t,c){document.getElementById('bt').textContent=t;btn.className='pb '+(c||'')}
function rollLoot(){
  const tb=performance.now()<buffUntil?RARITY_BUFF:RARITY_BASE;let r=Math.random()*100,rar='common';
  for(const k of ORDER){if(r<tb[k]){rar=k;break}r-=tb[k]}
  const it=LOOT[rar][Math.floor(Math.random()*LOOT[rar].length)];return{rar,name:it.n,desc:it.d||'',tag:it.tag||'',eff:it.eff||'',slot:SLOTOF[it.n]||''};
}

function splash(x,y){sfx.splash();ripples.push({x,y,r:1,a:1});for(let i=0;i<6;i++)drops.push({x,y,vx:rnd(-25,25),vy:rnd(-45,-20),l:1})}
const BOAT={x0:48,x1:116};

cv.addEventListener('pointerdown',e=>{
  const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*W,y=(e.clientY-b.top)/b.height*H;
  if(bottle&&Math.hypot(x-bottle.x,y-(bottle.y+bottle.bob))<14){
    bottle=null;buffUntil=performance.now()+BUFF_SECONDS*1000;buzz(80);sfx.chime();
    say('Message: “Fair winds ahead.” Rarer catches for '+BUFF_SECONDS+'s!','#e59a12');scheduleBottle();splash(x,y);return;
  }
  if(x>BOAT.x0&&x<BOAT.x1+4&&y>boatY-22&&y<boatY+26){rock=1;sfx.knock();return}
  if(y>H*0.1)splash(x,y);

    const f=reelItem;say(f.rar.toUpperCase()+': '+f.name,COLORS[f.rar]);addItem(f);sfx.catch(f.rar);total++;totalEl.textContent='Caught: '+total;

  drops.forEach(d=>{d.x+=d.vx*dt;d.y+=d.vy*dt;d.vy+=130*dt;d.l-=dt*2});drops=drops.filter(d=>d.l>0);

  ripples.forEach(r=>{ctx.globalAlpha=Math.max(0,r.a);const n=Math.max(16,Math.round(r.r*5));for(let i=0;i<n;i++){const th=i/n*6.283;R(r.x+r.r*Math.cos(th),r.y+r.r*.45*Math.sin(th),1,1,'#fff')}ctx.globalAlpha=1});
  drops.forEach(d=>R(d.x,d.y,2,2,'#e8f4ff'));
}
requestAnimationFrame(loop);
</script>
